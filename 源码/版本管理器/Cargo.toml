[package]
name = "launcher"
# 开发套件版本号（唯一真相源，发布包名/版本目录/zip内 版本<号>/ 均跟随）
# 键名 version 为 Cargo 硬性规范，必须保持英文，其语义即"开发套件版本号"；
# 换版本只改这一处（命令行入口 版本 命令、产出发布 打包 自动跟随）。
version = "0.0.1"
edition = "2021"
license.workspace = true
description = "智语言引导程序 — 统一入口、版本匹配、命令转发、环境管理（规范 6.1.3）"

# 版本管理器：统一入口、版本匹配、命令转发
[[bin]]
name = "智语言"
path = "src/主程序.rs"

# lib：吸收原 工具链 crate 的 版本/注册表/安装器 模块（多二进制架构共享真相源）
[lib]
path = "src/库.rs"

# 开发套件本体：业务命令（运行/构建/测试/创建/库/…）
[[bin]]
name = "智语言开发套件"
path = "src/命令行入口.rs"

# 产出发布：将构建产物打包为开发套件发布文件（第3个 bin）
[[bin]]
name = "产出发布"
path = "src/产出发布.rs"

# 安装程序：自解压单文件安装器（第4个 bin，规范 6.1.5/6.1.6）
# 产出发布 会把 便携版 ZIP 追加到本 exe 末尾，生成
#   发布/版本<号>/安装包/智语言开发套件<号>(.exe)
[[bin]]
name = "智语言安装程序"
path = "src/安装程序.rs"

[dependencies]
pm = { path = "../项目管理" }
frontend = { path = "../前端" }
interpreter = { path = "../后端/解释器" }
compiler = { path = "../后端/编译器" }
basic_functions = { path = "../基础功能" }
libmgr = { path = "../库管理" }

serde_json = "1"
ureq = { version = "3", features = ["gzip"] }
