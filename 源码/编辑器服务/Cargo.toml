[package]
name = "editor_service"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "智语言-编辑器服务"
path = "src/主程序.rs"

[dependencies]
lsp-server = "0.7"
lsp-types = "0.95"
frontend = { path = "../前端" }
# 跨文件跳转需要**与编译器同源**的模块搜索路径（项目根 → 源码根 → 标准库 → 已安装库）
# ⚠ 不得自己拼路径规则：`依赖解析`/`目录` 是「模块从哪来」的单一真相，另写一份必然漂移
pm = { path = "../项目管理" }
serde_json = "1"
