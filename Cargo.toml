[workspace]
# 双许可：使用者可任选 MIT 或 Apache-2.0（见 LICENSE-MIT / LICENSE-APACHE）
members = ["源码/前端","源码/基础功能","源码/后端/解释器","源码/后端/编译器","源码/库管理","源码/编辑器服务","源码/项目管理","源码/版本管理器","源码/模拟服务器"]
default-members = ["源码/基础功能","源码/前端","源码/后端/解释器","源码/后端/编译器","源码/版本管理器"]
resolver = "2"

# dev 构建开启 O1：语义分析等大 match 函数（分析表达式/分析语句）在 debug(O0)
# 下会为所有分支分配统一大栈帧（实测 ~85KB/帧），9 层递归即耗尽 1MB 栈导致
# 「thread has overflowed its stack」。O1 保留调试信息与断言，仅优化栈帧/临时值布局。
[profile.dev]
opt-level = 1

[workspace.package]
license = "MIT OR Apache-2.0"
